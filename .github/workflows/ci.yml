name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check formatting
        run: npx prettier --check "src/**/*.ts"

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          JWT_SECRET: ci-test-secret-for-pipeline
          NODE_ENV: test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  security-test:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run security-focused tests
        run: npm run test:security
        env:
          JWT_SECRET: ci-test-secret-for-pipeline
          NODE_ENV: test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security-test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Verify build artifacts
        run: |
          ls -la dist/
          echo "Build artifacts exist:"
          test -f dist/index.js && echo "dist/index.js exists"
          test -f dist/app.js && echo "dist/app.js exists"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
      - name: Attach build SHA to artifact
        run: echo ${{ github.sha }} > dist/version.txt

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, codeql, secret-scanning]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.aniversario-core.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Simulate deployment - replace with actual deploy command
          # e.g., rsync, scp, or cloud deployment CLI
      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f https://staging.aniversario-core.example.com/health
      - name: Notify deployment
        run: |
          echo "Staging deployment complete for commit ${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, codeql, secret-scanning]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://aniversario-core.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Replace with actual deployment command
      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f https://aniversario-core.example.com/health
          echo "Health check passed"
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          # Implement rollback logic here
      - name: Notify deployment
        run: |
          echo "Production deployment complete for commit ${{ github.sha }}"
